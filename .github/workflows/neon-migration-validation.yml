name: Neon Migration Validation

on:
  push:
    branches:
      - migration/supabase-to-neon

permissions:
  contents: read

jobs:
  validate-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run Neon migration tests
        run: node --import tsx --test lib/rsvp/database-backend.test.ts lib/rsvp/idempotency.test.ts

  baseline-main-known-failures:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout main baseline read-only
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install main locked dependencies
        run: npm ci --ignore-scripts

      - name: Reproduce known failing tests on main
        run: node --import tsx --test lib/gifts/cha-lingerie-rsvp-gifts.regression.test.ts lib/jessica-samuel-wedding/photo-wall-disabled.test.ts lib/rsvp/validate-local.test.ts
