name: Temporary Moderation Auth Validation

on:
  push:
    branches:
      - migration/supabase-to-neon
    paths:
      - app/api/memories/moderate/route.ts
      - lib/jessica-samuel-wedding/moderation-auth.test.ts
      - .github/workflows/tmp-moderation-auth-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/supabase-to-neon
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript check
        run: npm run typecheck
      - name: Moderation authorization tests
        run: node --import tsx --test lib/jessica-samuel-wedding/moderation-auth.test.ts
