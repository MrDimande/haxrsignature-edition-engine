name: Edition Production migration dry run

on:
  push:
    branches:
      - migration/supabase-to-neon
    paths:
      - "neon/migrations/20260827220500_edition_production_core.sql"
      - "neon/migrations/20260827221000_edition_production_runtime_permissions.sql"
      - ".github/fixtures/edition-production-prereqs.sql"
      - ".github/workflows/edition-production-migration-dry-run.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neondb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: neondb
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Seed Production prerequisites
        run: |
          psql -v ON_ERROR_STOP=1 \
            -f .github/fixtures/edition-production-prereqs.sql

      - name: Apply Edition Production core migration
        run: |
          psql -v ON_ERROR_STOP=1 \
            -f neon/migrations/20260827220500_edition_production_core.sql

      - name: Create isolated runtime role for dry run
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE haxr_edition_runtime
            LOGIN
            PASSWORD 'github-actions-dry-run-only'
            NOINHERIT
            NOSUPERUSER
            NOCREATEDB
            NOCREATEROLE
            NOREPLICATION
            NOBYPASSRLS;
          SQL

      - name: Apply Edition Production runtime permissions
        run: |
          psql -v ON_ERROR_STOP=1 \
            -f neon/migrations/20260827221000_edition_production_runtime_permissions.sql

      - name: Verify least-privilege runtime and functional RPCs
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            v_event_id uuid := gen_random_uuid();
            v_result json;
            v_count integer;
          BEGIN
            INSERT INTO public.events(id, is_active)
            VALUES (v_event_id, true);

            INSERT INTO public.guests(
              event_id,
              name,
              name_normalized,
              qr_token,
              status,
              guest_source
            ) VALUES (
              v_event_id,
              'Manual Fixture',
              'manual fixture',
              replace(gen_random_uuid()::text, '-', ''),
              'invited',
              'manual'
            );

            GRANT haxr_edition_runtime TO postgres WITH SET TRUE;
            SET LOCAL ROLE haxr_edition_runtime;

            IF current_user <> 'haxr_edition_runtime' THEN
              RAISE EXCEPTION 'runtime role was not assumed';
            END IF;

            IF has_table_privilege(current_user, 'public.events', 'SELECT') THEN
              RAISE EXCEPTION 'runtime unexpectedly has SELECT on events';
            END IF;

            IF NOT has_table_privilege(
              current_user,
              'public.wedding_photos',
              'SELECT,INSERT,UPDATE'
            ) THEN
              RAISE EXCEPTION 'runtime missing wedding_photos privileges';
            END IF;

            IF NOT has_function_privilege(
              current_user,
              'public.submit_edition_rsvp(uuid,text,text,boolean,integer,text,text,text,text,text,boolean)',
              'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'runtime missing RSVP execute privilege';
            END IF;

            SELECT public.submit_edition_rsvp(
              v_event_id,
              'Canary Guest',
              'canary guest',
              true,
              2,
              'qa-edition',
              '',
              '',
              'Mensagem QA',
              'M',
              true
            ) INTO v_result;

            IF coalesce((v_result->>'ok')::boolean, false) IS NOT TRUE THEN
              RAISE EXCEPTION 'RSVP RPC failed: %', v_result;
            END IF;

            SELECT public.reserve_edition_gift(
              'qa-registry',
              'qa-gift',
              'QA Guest',
              'QA Gift'
            ) INTO v_result;

            IF coalesce((v_result->>'ok')::boolean, false) IS NOT TRUE THEN
              RAISE EXCEPTION 'gift RPC failed: %', v_result;
            END IF;

            INSERT INTO public.photo_upload_intents(
              id,
              invitation_slug,
              bucket_name,
              storage_path,
              content_type,
              declared_file_size_bytes,
              expires_at
            ) VALUES (
              gen_random_uuid(),
              'qa-edition',
              'qa-bucket',
              'qa-edition/photo.jpg',
              'image/jpeg',
              1024,
              now() + interval '10 minutes'
            );

            INSERT INTO public.wedding_photos(
              id,
              invitation_slug,
              storage_path,
              original_filename,
              content_type,
              file_size_bytes,
              moderation_status,
              participant_id
            ) VALUES (
              gen_random_uuid(),
              'qa-edition',
              'qa-edition/final.jpg',
              'final.jpg',
              'image/jpeg',
              1024,
              'pending',
              gen_random_uuid()
            );

            UPDATE public.wedding_photos
            SET moderation_status = 'approved'
            WHERE invitation_slug = 'qa-edition';

            SELECT count(*)
            INTO v_count
            FROM public.guests;

            IF v_count <> 1 THEN
              RAISE EXCEPTION
                'RLS guest policy leaked non-Edition rows; visible=%',
                v_count;
            END IF;

            RESET ROLE;
            REVOKE haxr_edition_runtime FROM postgres;
          END
          $$;
          SQL

      - name: Reapply migrations to prove idempotence
        run: |
          psql -v ON_ERROR_STOP=1 \
            -f neon/migrations/20260827220500_edition_production_core.sql
          psql -v ON_ERROR_STOP=1 \
            -f neon/migrations/20260827221000_edition_production_runtime_permissions.sql

      - name: Final assertions
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          SELECT
            current_database() = 'neondb' AS database_ok,
            to_regclass('public.photo_upload_intents') IS NOT NULL AS intents_ok,
            to_regclass('public.wedding_photos') IS NOT NULL AS photos_ok,
            to_regprocedure('public.reserve_edition_gift(text,text,text,text)') IS NOT NULL AS gift_rpc_ok,
            to_regprocedure('public.submit_edition_rsvp(uuid,text,text,boolean,integer,text,text,text,text,text,boolean)') IS NOT NULL AS rsvp_rpc_ok;
          SQL
